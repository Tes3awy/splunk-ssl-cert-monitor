[cert:ssl:json]
SHOULD_LINEMERGE = false
KV_MODE = none
AUTO_KV_JSON = true
TIME_PREFIX = "scan_time":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 30

## -------------------------------------------------------------
## CIM Field Aliases (Certificates Data Model)
## -------------------------------------------------------------
FIELDALIAS-dest                = target_host AS dest
FIELDALIAS-dest_port           = target_port AS dest_port
FIELDALIAS-ssl_subject         = subject_cn AS ssl_subject
FIELDALIAS-ssl_subject_common_name = subject_cn AS ssl_subject_common_name
FIELDALIAS-ssl_subject_unit    = subject_org AS ssl_subject_unit
FIELDALIAS-ssl_subject_alt_name= subject_alt_names{} AS ssl_subject_alt_name
FIELDALIAS-ssl_issuer          = issuer_org AS ssl_issuer
FIELDALIAS-ssl_issuer_common_name = issuer_cn AS ssl_issuer_common_name
FIELDALIAS-ssl_serial          = serial_number AS ssl_serial
FIELDALIAS-ssl_cipher          = cipher AS ssl_cipher

## -------------------------------------------------------------
## CIM Calculated Fields (EVAL)
## -------------------------------------------------------------
# Convert ISO-8601 strings to UNIX epoch timestamps (CIM requirement)
EVAL-ssl_start_time = strptime(valid_from, "%Y-%m-%dT%H:%M:%SZ")
EVAL-ssl_end_time   = strptime(valid_to, "%Y-%m-%dT%H:%M:%SZ")

# Map status to CIM-standard boolean/flags
EVAL-ssl_is_valid   = if(status=="VALID", "true", "false")

# Parse TLS/SSL protocol family and version
EVAL-ssl_version    = case(like(tls_version, "TLS%"), tls_version, like(tls_version, "SSL%"), tls_version, true(), "unknown")
EVAL-ssl_signature_algorithm = "unknown"