[cert_checker]
python.version = python3
python.required = 3.13

[cert_checker://internal_api_gateway]
target_host = api.internal.local
port = 443
sni = api.internal.local
interval = 86400
verify_cert = false
timeout = 10
disabled = 1

[cert_checker://public_website]
target_host = www.example.com
port = 443
sni = www.example.com
interval = 86400
verify_cert = true
timeout = 10
disabled = 1

[cert_checker://enterprise_bulk_scan]
targets_csv = ssl_targets.csv
interval = 86400
disabled = 0