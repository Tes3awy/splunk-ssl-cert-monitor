name: Splunk AppInspect CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - "TA-cert-monitor/**"
      - "splunk-app-cert-monitor/**"
      - ".github/workflows/appinspect.yml"
  push:
    branches: [main, master]
    paths:
      - "TA-cert-monitor/**"
      - "splunk-app-cert-monitor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-inspect:
    name: Slim Package & AppInspect Linter
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - folder: "TA-cert-monitor"
            artifact_name: "TA-cert-monitor"
          - folder: "splunk-app-cert-monitor"
            artifact_name: "splunk-app-cert-monitor"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (libmagic)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Packaging & Inspection Tooling
        run: |
          python -m pip install --upgrade pip
          pip install splunk-packaging-toolkit splunk-appinspect

      - name: Clean Temporary & System Artifacts
        run: |
          find ${{ matrix.app.folder }} -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find ${{ matrix.app.folder }} -type f -name "*.py[co]" -delete 2>/dev/null || true
          find ${{ matrix.app.folder }} -type f -name ".DS_Store" -delete 2>/dev/null || true

      - name: Clean Vendored Artifacts
        run: |
          find TA-cert-monitor/bin/lib -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find TA-cert-monitor/bin/lib -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
          find TA-cert-monitor/ -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

      - name: Validate App Structure with Slim
        run: |
          slim validate ${{ matrix.app.folder }}

      - name: Build Package Archive with Slim
        run: |
          mkdir -p dist
          slim package -o dist/ ${{ matrix.app.folder }}
          # Normalize filename for downstream inspection and artifact upload
          mv dist/${{ matrix.app.artifact_name }}-*.tar.gz ${{ matrix.app.artifact_name }}.tar.gz

      - name: Execute Splunk AppInspect
        run: |
          mkdir -p inspect-reports

          # 1. Output summary directly to console logs
          splunk-appinspect inspect ${{ matrix.app.artifact_name }}.tar.gz \
            --mode precert \
            --included-tags splunk_appinspect || true

          # 2. Generate JSON report for programmatic check
          splunk-appinspect inspect ${{ matrix.app.artifact_name }}.tar.gz \
            --mode precert \
            --included-tags splunk_appinspect \
            --output-file inspect-reports/${{ matrix.app.artifact_name }}-report.json \
            --data-format json || true

      - name: Verify Zero AppInspect Failures
        run: |
          python -c '
          import json, sys

          report_path = "inspect-reports/${{ matrix.app.artifact_name }}-report.json"
          with open(report_path, "r") as f:
              data = json.load(f)

          summary = data.get("summary", {})
          failures = summary.get("failure", 0)
          errors = summary.get("error", 0)
          warnings = summary.get("warning", 0)
          manual_checks = summary.get("manual_check", 0)

          print(f"AppInspect Summary for ${{ matrix.app.artifact_name }}:")
          print(f" - Failures:      {failures}")
          print(f" - Errors:        {errors}")
          print(f" - Warnings:      {warnings}")
          print(f" - Manual Checks: {manual_checks}")

          if failures > 0 or errors > 0:
              print("\n[ERROR] AppInspect reported failures or structural errors. Review log above.")
              sys.exit(1)
          '

      - name: Upload Built Package & Inspection Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.app.artifact_name }}
          path: |
            ${{ matrix.app.artifact_name }}.tar.gz
            inspect-reports/
          retention-days: 14
