name: Splunk AppInspect CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - "TA-cert-monitor/**"
      - "splunk-app-cert-monitor/**"
      - ".github/workflows/appinspect.yml"
  push:
    branches: [main, master]
    paths:
      - "TA-cert-monitor/**"
      - "splunk-app-cert-monitor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-ta:
    name: Build & Inspect TA-cert-monitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (libmagic)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tooling
        run: |
          python -m pip install --upgrade pip
          pip install splunk_add_on_ucc_framework splunk-packaging-toolkit git-cliff

      - name: Clean Source Artifacts
        run: |
          find TA-cert-monitor -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find TA-cert-monitor -type f -name "*.py[co]" -delete 2>/dev/null || true
          find TA-cert-monitor -type f -name ".DS_Store" -delete 2>/dev/null || true

      - name: Build with UCC
        run: |
          cd TA-cert-monitor
          ucc-gen build --ta-version 2.0.0
          # Clean any stray test/bin artifacts in vendored lib if present
          rm -rf output/TA-cert-monitor/lib/bin 2>/dev/null || true

      - name: Package with UCC
        run: |
          cd TA-cert-monitor
          ucc-gen package --path output/TA-cert-monitor
          mkdir -p ../dist
          mv TA-cert-monitor-*.tar.gz ../dist/TA-cert-monitor.tar.gz

      - name: Execute Splunk AppInspect on TA
        run: |
          mkdir -p inspect-reports
          splunk-appinspect inspect dist/TA-cert-monitor.tar.gz \
            --mode precert \
            --included-tags splunk_appinspect || true

          splunk-appinspect inspect dist/TA-cert-monitor.tar.gz \
            --mode precert \
            --included-tags splunk_appinspect \
            --output-file inspect-reports/TA-cert-monitor-report.json \
            --data-format json

      - name: Verify Zero Failures
        run: |
          python -c '
          import json, sys
          with open("inspect-reports/TA-cert-monitor-report.json", "r") as f:
              data = json.load(f)
          summary = data.get("summary", {})
          failures = summary.get("failure", 0)
          errors = summary.get("error", 0)
          print(f"TA-cert-monitor Results -> Errors: {errors}, Failures: {failures}")
          if failures > 0 or errors > 0:
              sys.exit(1)
          '

      - name: Upload TA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-ta-artifacts
          path: |
            dist/TA-cert-monitor.tar.gz
            inspect-reports/TA-cert-monitor-report.json

  inspect-app:
    name: Build & Inspect splunk-app-cert-monitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (libmagic)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packaging & Inspection Tooling
        run: |
          python -m pip install --upgrade pip
          pip install splunk-packaging-toolkit splunk-appinspect

      - name: Clean Source Artifacts
        run: |
          find splunk-app-cert-monitor -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find splunk-app-cert-monitor -type f -name "*.py[co]" -delete 2>/dev/null || true
          find splunk-app-cert-monitor -type f -name ".DS_Store" -delete 2>/dev/null || true

      - name: Validate App Structure with Slim
        run: |
          slim validate splunk-app-cert-monitor

      - name: Build Package Archive with Slim
        run: |
          mkdir -p dist
          slim package -o dist/ splunk-app-cert-monitor
          mv dist/splunk-app-cert-monitor-*.tar.gz dist/splunk-app-cert-monitor.tar.gz

      - name: Execute Splunk AppInspect on App
        run: |
          mkdir -p inspect-reports
          splunk-appinspect inspect dist/splunk-app-cert-monitor.tar.gz \
            --mode precert \
            --included-tags splunk_appinspect || true

          splunk-appinspect inspect dist/splunk-app-cert-monitor.tar.gz \
            --mode precert \
            --included-tags splunk_appinspect \
            --output-file inspect-reports/splunk-app-cert-monitor-report.json \
            --data-format json

      - name: Verify Zero Failures
        run: |
          python -c '
          import json, sys
          with open("inspect-reports/splunk-app-cert-monitor-report.json", "r") as f:
              data = json.load(f)
          summary = data.get("summary", {})
          failures = summary.get("failure", 0)
          errors = summary.get("error", 0)
          print(f"splunk-app-cert-monitor Results -> Errors: {errors}, Failures: {failures}")
          if failures > 0 or errors > 0:
              sys.exit(1)
          '

      - name: Upload App Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-app-artifacts
          path: |
            dist/splunk-app-cert-monitor.tar.gz
            inspect-reports/splunk-app-cert-monitor-report.json
