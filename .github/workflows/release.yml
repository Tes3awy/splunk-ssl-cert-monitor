name: Release & Changelog

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Packages & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tooling
        run: |
          python -m pip install --upgrade pip
          pip install addonfactory-ucc-generator splunk-packaging-toolkit git-cliff

      - name: Build & Package TA-cert-monitor with UCC
        run: |
          mkdir -p dist
          cd TA-cert-monitor
          ucc-gen build --ta-version "${GITHUB_REF_NAME#v}"
          rm -rf output/TA-cert-monitor/lib/bin 2>/dev/null || true
          ucc-gen package --path output/TA-cert-monitor
          mv TA-cert-monitor-*.tar.gz ../dist/

      - name: Build splunk-app-cert-monitor with Slim
        run: |
          slim package -o dist/ splunk-app-cert-monitor

      - name: Generate Changelog
        run: |
          git-cliff --latest --strip header > RELEASE_NOTES.md
          git-cliff --output CHANGELOG.md

      - name: Commit and Push Updated CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update CHANGELOG.md for ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
