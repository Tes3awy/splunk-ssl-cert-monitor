name: Release & Changelog

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Packages & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Tooling (Slim & Git-Cliff)
        run: |
          python -m pip install --upgrade pip
          pip install splunk-packaging-toolkit git-cliff

      - name: Build Tarballs with Slim
        run: |
          mkdir -p dist
          slim package -o dist/ TA-cert-monitor
          slim package -o dist/ splunk-app-cert-monitor

      - name: Generate Changelog
        run: |
          # Generate release notes for this specific release
          git-cliff --latest --strip header > RELEASE_NOTES.md

          # Update the full CHANGELOG.md in the repo
          git-cliff --output CHANGELOG.md

      - name: Commit and Push Updated CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update CHANGELOG.md for ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
