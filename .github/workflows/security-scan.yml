name: Security & AppInspect Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  sast-and-secrets:
    name: Code & Secret Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit SAST
        run: |
          bandit -r TA-cert-monitor/package/bin -ll -ii -v

      - name: Run Dependency Audit (SCA)
        if: hashFiles('requirements.txt') != ''
        run: |
          pip-audit -r requirements.txt

  appinspect:
    name: Splunk AppInspect Gate
    runs-on: ubuntu-latest
    needs: sast-and-secrets
    strategy:
      matrix:
        target:
          - dir: "TA-cert-monitor/package"
            pkg: "TA-cert-monitor"
          - dir: "splunk-cert-monitor-app"
            pkg: "splunk-cert-monitor-app"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install AppInspect CLI
        run: |
          pip install splunk-appinspect

      - name: Build Test Tarball
        run: |
          tar --exclude='.git*' \
              --exclude='*.pyc' \
              --exclude='__pycache__' \
              -czf ${{ matrix.pkg }}.tar.gz -C ${{ matrix.dir }} .

      - name: Run AppInspect Precog Check
        run: |
          splunk-appinspect inspect ${{ matrix.pkg }}.tar.gz \
            --mode precert \
            --included-tags splunk_appinspect \
            --output-file appinspect_report.json

      - name: Validate AppInspect Exit Code
        run: |
          python -c '
          import json, sys
          with open("appinspect_report.json") as f:
              data = json.load(f)
          failures = data.get("summary", {}).get("failure", 0)
          errors = data.get("summary", {}).get("error", 0)
          print(f"AppInspect Failures: {failures}, Errors: {errors}")
          if failures > 0 or errors > 0:
              sys.exit(1)
          '
