[default]
disabled = 0
quantity = 0
enableSched = 1
counttype = number of events
dispatch.latest_time = now
request.ui_dispatch_app = cert_monitor
request.ui_dispatch_view = search
alert.suppress = 1
alert.suppress.period = 86400s

[SSL Certificate Expiration - Critical Alert (15 Days)]
description = Triggers when an SSL/TLS certificate has 15 or fewer days remaining before expiration, or is already expired.
search = `ssl_cert_index` `ssl_cert_sourcetype` status!="UNKNOWN" status!="CONNECTION_ERROR" \
| stats latest(valid_to) as valid_to, latest(days_remaining) as days_remaining, latest(issuer_cn) as issuer, latest(status) as status by dest, dest_port, sni \
| where days_remaining <= 15 OR status="EXPIRED" \
| eval risk_priority=case(days_remaining <= 0 OR status="EXPIRED", "Critical - Expired", days_remaining <= 7, "Critical - < 7 Days", 1=1, "High - <= 15 Days") \
| sort days_remaining
dispatch.earliest_time = -1d
cron_schedule = 0 6 * * *
relation = greater than
alert.severity = 5
alert.suppress.fields = dest,dest_port,sni
action.cert_alert_webhook = 0
action.cert_alert_webhook.param.severity = critical

[SSL Certificate Expiration - Warning Alert (30 Days)]
description = Daily warning report flagging SSL/TLS certificates entering their 30-day renewal cycle.
search = `ssl_cert_index` `ssl_cert_sourcetype` status!="UNKNOWN" status!="CONNECTION_ERROR" \
| stats latest(valid_to) as valid_to, latest(days_remaining) as days_remaining, latest(issuer_cn) as issuer by dest, dest_port, sni \
| where days_remaining > 15 AND days_remaining <= 30 \
| eval status="EXPIRING_WARNING" \
| sort days_remaining
dispatch.earliest_time = -1d
cron_schedule = 0 6 * * *
relation = greater than
alert.severity = 3
alert.suppress.fields = dest,dest_port,sni
action.cert_alert_webhook = 0
action.cert_alert_webhook.param.severity = high

[SSL Certificate Security Audit - Insecure Protocol or Cipher]
description = Weekly audit identifying target endpoints negotiating deprecated TLS versions, weak ciphers, or flagging positive for legacy protocols.
search = `ssl_cert_index` `ssl_cert_sourcetype` status!="CONNECTION_ERROR" \
| stats latest(negotiated_tls_version) as negotiated_tls_version, latest(cipher) as cipher, latest(has_legacy_tls) as has_legacy_tls, latest(_time) as last_seen by dest, dest_port, sni \
| search negotiated_tls_version IN ("TLSv1", "TLSv1.1", "SSLv2", "SSLv3") OR cipher="*RC4*" OR cipher="*3DES*" OR cipher="*NULL*" OR has_legacy_tls="true" \
| eval last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S UTC")
dispatch.earliest_time = -7d
cron_schedule = 0 7 * * 1
relation = greater than
alert.severity = 4
alert.suppress.fields = dest,dest_port,sni

[SSL Certificate Security Incident - Revoked Certificate Detected]
description = Critical security alert triggering immediately when an active SSL/TLS certificate is flagged as revoked by its OCSP responder.
search = `ssl_cert_index` `ssl_cert_sourcetype` (status="REVOKED" OR revocation_status="REVOKED") \
| stats latest(revocation_reason) as revocation_reason, latest(issuer_cn) as issuer, latest(valid_to) as valid_to, latest(serial_number) as serial_number by dest, dest_port, sni \
| eval alert_type="CERTIFICATE_REVOCATION"
dispatch.earliest_time = -1h
cron_schedule = */15 * * * *
relation = greater than
alert.severity = 5
alert.suppress.fields = dest,dest_port,serial_number
action.cert_alert_webhook = 0
action.cert_alert_webhook.param.severity = critical

[SSL Certificate Audit - Endpoint Connection Failures]
description = Detects monitored endpoints failing TCP handshake, timing out, or rejecting TLS connections.
search = `ssl_cert_index` `ssl_cert_sourcetype` status="CONNECTION_ERROR" \
| stats count, latest(error) as error, latest(_time) as last_failure by dest, dest_port, sni \
| eval last_failure=strftime(last_failure, "%Y-%m-%d %H:%M:%S UTC")
dispatch.earliest_time = -1h
cron_schedule = 0 * * * *
relation = greater than
alert.severity = 3
alert.suppress.period = 14400s
alert.suppress.fields = dest,dest_port
