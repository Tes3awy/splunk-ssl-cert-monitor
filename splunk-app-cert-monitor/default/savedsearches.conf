[default]
disabled = 0

[SSL Certificate Expiration - Critical Alert (15 Days)]
description = Triggers when an SSL/TLS certificate has 15 or fewer days remaining before expiration, or is already expired.
search = `ssl_cert_index` sourcetype="cert:ssl:json" \
| stats latest(valid_to) as valid_to, latest(days_remaining) as days_remaining, latest(issuer_cn) as issuer by dest, dest_port, sni \
| where days_remaining <= 15 \
| eval status=if(days_remaining <= 0, "EXPIRED", "EXPIRING_CRITICAL") \
| sort days_remaining
dispatch.earliest_time = -1d
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 86400s
alert.suppress.fields = dest,dest_port,sni

[SSL Certificate Expiration - Warning Alert (30 Days)]
description = Daily warning report flagging SSL/TLS certificates entering their 30-day renewal cycle.
search = `ssl_cert_index` sourcetype="cert:ssl:json" \
| stats latest(valid_to) as valid_to, latest(days_remaining) as days_remaining, latest(issuer_cn) as issuer by dest, dest_port, sni \
| where days_remaining > 15 AND days_remaining <= 30 \
| eval status="EXPIRING_WARNING" \
| sort days_remaining
dispatch.earliest_time = -1d
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 86400s
alert.suppress.fields = dest,dest_port,sni

[SSL Certificate Security Audit - Insecure Protocol or Cipher]
description = Weekly audit identifying target endpoints negotiating deprecated TLS versions or weak ciphers.
search = `ssl_cert_index` sourcetype="cert:ssl:json" \
| stats latest(ssl_version) as ssl_version, latest(ssl_cipher) as ssl_cipher, latest(_time) as last_seen by dest, dest_port, sni \
| search ssl_version IN ("TLSv1", "TLSv1.1", "SSLv2", "SSLv3") OR ssl_cipher="*RC4*" OR ssl_cipher="*3DES*" OR ssl_cipher="*NULL*" \
| eval last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S UTC")
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 0 7 * * 1
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 604800s
alert.suppress.fields = dest,dest_port,sni