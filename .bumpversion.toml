[tool.bumpversion]
current_version = "2.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"
allow_dirty = false
commit = true
message = "chore(release): bump version {current_version} -> {new_version}"
commit_args = "--no-verify"

# --- TA-cert-monitor (UCC Source & Manifest) ---
[[tool.bumpversion.files]]
filename = "TA-cert-monitor/package/bin/cert_checker_helper.py"
search = 'Version: {current_version}'
replace = 'Version: {new_version}'

[[tool.bumpversion.files]]
filename = "TA-cert-monitor/package/app.manifest"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "TA-cert-monitor/package/bin/cert_alert_webhook.py"
search = "Splunk-TA-cert-monitor-Webhook/{current_version}"
replace = "Splunk-TA-cert-monitor-Webhook/{new_version}"

# --- splunk-app-cert-monitor App ---
[[tool.bumpversion.files]]
filename = "splunk-app-cert-monitor/default/app.conf"
search = "version = {current_version}"
replace = "version = {new_version}"

[[tool.bumpversion.files]]
filename = "splunk-app-cert-monitor/default/app.conf"
regex = true
search = 'build = \d+'
replace = "build = {now:%Y%m%d%H%M}"

[[tool.bumpversion.files]]
filename = "splunk-app-cert-monitor/app.manifest"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

# --- Root Documentation ---
[[tool.bumpversion.files]]
filename = "README.md"
search = "TA-cert-monitor-{current_version}.tar.gz"
replace = "TA-cert-monitor-{new_version}.tar.gz"

[[tool.bumpversion.files]]
filename = "README.md"
search = "splunk-app-cert-monitor-{current_version}.tar.gz"
replace = "splunk-app-cert-monitor-{new_version}.tar.gz"

# --- Other Files ---
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
